<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrador de Citas - Azul</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
:root {
    --vet-blue: #0d6efd;
    --soft-bg: #eef2f7;
}

body {
    background: linear-gradient(180deg, #f8f9fa, var(--soft-bg));
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
}

h2 {
    font-weight: 800;
    letter-spacing: .5px;
}

.btn-add {
    border: 2px solid var(--vet-blue);
    color: var(--vet-blue);
    font-weight: 600;
    border-radius: 30px;
    padding: 10px 26px;
    transition: .3s;
    background: white;
}

.btn-add:hover {
    background-color: var(--vet-blue);
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(13,110,253,.4);
}

.divider {
    height: 7px;
    background: linear-gradient(90deg, var(--vet-blue), #6ea8fe);
    border-radius: 20px;
    margin: 25px 0;
}

.card-cita {
    border-radius: 22px;
    border-left: 8px solid var(--vet-blue);
    transition: all 0.35s ease;
    box-shadow: 0 15px 35px rgba(0,0,0,.12);
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 6px;
    min-height: 220px;
}

.card-cita:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 25px 45px rgba(0,0,0,.18);
}

.estado-Abierta {
    border-left-color: #0d6efd;
    background: linear-gradient(135deg, #e7f1ff, #ffffff);
}

.estado-Terminada {
    border-left-color: #198754;
    background: linear-gradient(135deg, #e6f7ef, #ffffff);
}

.estado-Anulada {
    border-left-color: #dc3545;
    background: linear-gradient(135deg, #fdecea, #ffffff);
}

.card-header-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
}

.emoji-mascota {
    font-size: 40px;
    background: white;
    border-radius: 50%;
    width: 62px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    animation: float 3s ease-in-out infinite;
}

.card-nombre {
    font-size: 1.05rem;
    font-weight: 700;
    color: #1a1a2e;
    line-height: 1.2;
    word-break: break-word;
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
}

.card-cita .info-row {
    font-size: 0.85rem;
    color: #444;
    margin: 0;
}

.card-cita .btn {
    border-radius: 50%;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .3s;
}

.card-cita .btn:hover {
    transform: scale(1.15);
}

.footer-line {
    background: linear-gradient(90deg, var(--vet-blue), #6ea8fe);
    height: 40px;
    position: fixed;
    bottom: 0;
    width: 100%;
}

/* Responsividad para pantallas ≤450px */
@media (max-width: 450px) {
    .d-flex.flex-wrap.justify-content-between {
        flex-direction: column;   /* apilar verticalmente */
        align-items: center;      /* centrar horizontalmente */
        gap: 15px;                /* espacio entre select y botón */
    }

    .d-flex.flex-wrap.justify-content-between select,
    .d-flex.flex-wrap.justify-content-between .btn-add {
        width: 90%;               /* casi todo el ancho */
        max-width: 300px;         /* no demasiado ancho */
    }
}
</style>
</head>

<body class="pb-5">

<div class="container mt-4">
<h2 class="text-center mb-4">Administrador de citas</h2>

<div class="d-flex flex-wrap justify-content-between align-items-end mb-3 gap-3">
    <div style="width: 250px;">
        <label class="form-label small text-muted">Filtrar por estado</label>
        <select id="filtroEstado" class="form-select border-primary">
            <option value="Abierta">Abierta</option>
            <option value="Terminada">Terminadas</option>
            <option value="Anulada">Anuladas</option>
        </select>
    </div>

    <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#modalCita"
        onclick="prepararNuevaCita()">AGREGAR CITA</button>
</div>

<div class="divider"></div>
<div id="listaCitas" class="row g-3"></div>
</div>

<footer class="footer-line"></footer>

<!-- Modal para agregar/editar cita -->
<div class="modal fade" id="modalCita" tabindex="-1" aria-labelledby="modalCitaLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalCitaLabel">Nueva Cita</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <form id="formCita">
          <div class="mb-3">
            <label for="nombreMascota" class="form-label">Nombre Mascota</label>
            <input type="text" class="form-control" id="nombreMascota" required>
          </div>
          <div class="mb-3">
            <label for="tipoMascota" class="form-label">Tipo</label>
            <select class="form-select" id="tipoMascota" required>
              <option value="" selected disabled>Seleccione un tipo</option>
              <option value="Perro">Perro</option>
              <option value="Gato">Gato</option>
              <option value="Ave">Ave</option>
              <option value="Conejo">Conejo</option>
              <option value="Hamster">Hamster</option>
              <option value="Pez">Pez</option>
              <option value="Tortuga">Tortuga</option>
              <option value="Caballo">Caballo</option>
              <option value="Vaca">Vaca</option>
              <option value="Cerdo">Cerdo</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="propietario" class="form-label">Propietario</label>
            <input type="text" class="form-control" id="propietario" required>
          </div>
          <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="text" class="form-control" id="telefono" required>
          </div>
          <div class="mb-3">
            <label for="fecha" class="form-label">Fecha</label>
            <input type="date" class="form-control" id="fecha" required>
          </div>
          <div class="mb-3">
            <label for="hora" class="form-label">Hora</label>
            <input type="time" class="form-control" id="hora" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="guardarCita()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
let citas = JSON.parse(localStorage.getItem('citas_vet_blue')) || [];

const filtroEstado = document.getElementById('filtroEstado');

function alerta(texto) {
    Swal.fire({ icon: 'warning', title: 'Atención', text: texto, confirmButtonColor: '#0d6efd' });
}

function obtenerEmoji(tipo) {
    const emojis = {
        Perro:'🐶', Gato:'🐱', Ave:'🐦', Conejo:'🐰',
        Hamster:'🐹', Pez:'🐠', Tortuga:'🐢',
        Caballo:'🐴', Vaca:'🐮', Cerdo:'🐷',
        Otro:'🐏'
    };
    return emojis[tipo] || '🐾';
}

function cargarCitas() {
    const lista = document.getElementById('listaCitas');
    const filtro = filtroEstado.value;
    lista.innerHTML = '';

    citas.filter(c => c.estado === filtro).forEach((cita, i) => {
        lista.innerHTML += `
        <div class="col-12 col-sm-6 col-md-4">
            <div class="card card-cita estado-${cita.estado}">
                <div class="card-header-row">
                    <div class="emoji-mascota">${obtenerEmoji(cita.tipo)}</div>
                    <div class="card-nombre">${cita.nombreMascota}</div>
                </div>

                <p class="info-row"><strong>Propietario:</strong> ${cita.propietario}</p>
                <p class="info-row"><strong>Tel:</strong> ${cita.telefono}</p>
                <p class="info-row"><strong>Fecha:</strong> ${cita.fecha} ${cita.hora}</p>

                <select class="form-select form-select-sm mt-1"
                    onchange="cambiarEstado(${i}, this.value)">
                    <option ${cita.estado=='Abierta'?'selected':''}>Abierta</option>
                    <option ${cita.estado=='Terminada'?'selected':''}>Terminada</option>
                    <option ${cita.estado=='Anulada'?'selected':''}>Anulada</option>
                </select>

                <div class="d-flex justify-content-center gap-2 mt-3">
                    <button class="btn btn-outline-primary"
                        onclick="editarCita(${i})"><i class="bi bi-pencil-square"></i></button>
                    <button class="btn btn-outline-danger"
                        onclick="prepararEliminar(${i})"><i class="bi bi-trash"></i></button>
                </div>
            </div>
        </div>`;
    });
}

function prepararNuevaCita() {
    document.getElementById('formCita').reset();
    document.getElementById('tipoMascota').value = ""; // que no aparezca seleccionado
    document.getElementById('modalCitaLabel').textContent = 'Nueva Cita';
}

function guardarCita() {
    const nombreMascota = document.getElementById('nombreMascota').value.trim();
    const tipo = document.getElementById('tipoMascota').value;
    const propietario = document.getElementById('propietario').value.trim();
    const telefono = document.getElementById('telefono').value.trim();
    const fecha = document.getElementById('fecha').value;
    const hora = document.getElementById('hora').value;

    // Validación específica con SweetAlert2
    if (!nombreMascota) { alerta("Por favor ingrese el nombre de la mascota"); return; }
    if (!tipo) { alerta("Por favor seleccione el tipo de mascota"); return; }
    if (!propietario) { alerta("Por favor ingrese el nombre del propietario"); return; }
    if (!telefono) { alerta("Por favor ingrese el teléfono del propietario"); return; }
    if (!fecha) { alerta("Por favor seleccione la fecha de la cita"); return; }
    if (!hora) { alerta("Por favor seleccione la hora de la cita"); return; }

    const nuevaCita = { nombreMascota, tipo, propietario, telefono, fecha, hora, estado: "Abierta" };

    citas.push(nuevaCita);
    localStorage.setItem('citas_vet_blue', JSON.stringify(citas));
    cargarCitas();

    const modal = bootstrap.Modal.getInstance(document.getElementById('modalCita'));
    modal.hide();
}

filtroEstado.addEventListener('change', cargarCitas);
window.onload = cargarCitas;
</script>

</body>
</html>
